[package]
name = "mdc"
version = "0.1.12"
edition = "2021"
license = "MIT"
keywords = ["markdown"]
homepage = "https://mdcmd.com"
repository = "https://github.com/apstrand/mdcmd"
readme = "README.md"
description = "Terminal file browser and Markdown viewer"

[[bin]]
name = "mdc"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
anyhow = "1.0"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm", "image-defaults"] }
image = "0.25"
tui-term = "0.3.4"
portable-pty = "0.9.0"
vt100 = "0.16.2"
notify = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Local-only fix for a bug in ratatui-image 11.0.6's SlicedImage rendering
# (src/sliced.rs): when an image taller than the viewport is scrolled to a
# middle position (both skip_line_count and drop_line_count nonzero), the
# `take()` count is computed from the pre-`skip()` length instead of what's
# left after skipping, so `min(skip_line_count, drop_line_count)` extra rows
# render past where the image should end. Not submitted upstream — see
# vendor/ratatui-image-11.0.6/src/sliced.rs for the one-line fix.
[patch.crates-io]
ratatui-image = { path = "vendor/ratatui-image-11.0.6" }
