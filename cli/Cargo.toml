[package]
name = "mdc"
version = "0.1.8"
edition = "2021"
license = "MIT"
keywords = ["markdown"]
homepage = "https://mdcmd.com"
repository = "https://github.com/apstrand/mdcmd"
readme = "README.md"
description = "Terminal file browser and Markdown viewer"

[[bin]]
name = "mdc"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
anyhow = "1.0"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm", "image-defaults"] }
image = "0.25"
termbg = "0.6.2"
tui-term = "0.3.4"
portable-pty = "0.9.0"
vt100 = "0.16.2"
