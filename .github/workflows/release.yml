name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: 

permissions:
  contents: write
  packages: write
  
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-24.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Install system dependencies (Linux only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            pkg-config

      # tauri-bundler mirrors WebKitWebProcess/WebKitNetworkProcess into the
      # AppImage at whatever path they're found on the build machine (see
      # crates/tauri-bundler/src/bundle/linux/appimage/linuxdeploy.rs), while
      # libwebkit2gtk-4.1.so.0 itself always gets flattened into usr/lib/.
      # On Ubuntu's multiarch layout those helpers live under
      # /usr/lib/x86_64-linux-gnu/webkit2gtk-4.1, so they land at a path in
      # the AppImage that doesn't match where the .so ends up, and
      # WebKitGTK's runtime process lookup fails silently: the app window
      # shows its native menu but the webview stays black. Mirroring the
      # helpers into the plain (non-multiarch) path here makes the bundler's
      # own search loop also copy them to the flattened location it needs.
      - name: Work around AppImage webkit2gtk multiarch path bug (Linux only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          src=/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1
          dest=/usr/lib/webkit2gtk-4.1
          sudo mkdir -p "$dest/injected-bundle"
          sudo cp -n "$src/WebKitNetworkProcess" "$dest/"
          sudo cp -n "$src/WebKitWebProcess" "$dest/"
          sudo cp -n "$src/injected-bundle/libwebkit2gtkinjectedbundle.so" "$dest/injected-bundle/"

      - name: Install frontend dependencies
        run: npm ci

      # Materialize the App Store Connect API key (.p8) so Tauri can notarize.
      - name: Prepare notarization API key (macOS only)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/authkey.p8"

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS Developer ID signing. tauri-action imports this .p12 into a
          # temporary keychain when APPLE_CERTIFICATE is set (no-op on Linux).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # macOS notarization + stapling via App Store Connect API key.
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/authkey.p8
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Release ${{ github.ref_name }}'
          releaseBody: 'Automated release for version ${{ github.ref_name }}.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  flatpak:
    name: Build Flatpak
    needs: release
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The manifest's git source is pinned to a specific tag/commit so it
      # always builds something known-working when run locally. For a
      # release build we want it to build the exact tag/commit being
      # released instead, so overwrite the pin here.
      - name: Pin the Flatpak manifest to this release
        run: |
          sed -i "s/tag: .*/tag: ${{ github.ref_name }}/" flatpak/com.mdcmd.App.yml
          sed -i "s/commit: .*/commit: ${{ github.sha }}/" flatpak/com.mdcmd.App.yml

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: MarkDown.Commander_${{ github.ref_name }}_x86_64.flatpak
          manifest-path: flatpak/com.mdcmd.App.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Flatpak bundle to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: MarkDown.Commander_${{ github.ref_name }}_x86_64.flatpak
